services:
  api:
    build: .
    environment:
      MOCK_EXTERNAL: "1"
      OPENAI_API_KEY: fake
      GOOGLE_MAPS_API_KEY: fake
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.5"
  nginx:
    image: nginx:stable
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

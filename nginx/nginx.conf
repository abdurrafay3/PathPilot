worker_processes auto;
worker_rlimit_nofile 131072;

events {
    worker_connections 65536;
}

http {
    upstream api_servers {
        server api:8000;
        keepalive 256;
    }
    server {
        listen 80;

        location / {
            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }
    }
}
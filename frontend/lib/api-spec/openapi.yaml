openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Path Pilot API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: route
    description: Route planning operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /route/plan:
    post:
      operationId: planRoute
      tags: [route]
      summary: Plan a route from a natural language prompt
      description: Accepts a user prompt and returns a validated route with waypoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteInput"
      responses:
        "200":
          description: Route planning result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConstraintValidatorAgentOutput"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Upstream backend error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /route/history:
    get:
      operationId: getRouteHistory
      tags: [route]
      summary: Get recent route planning history
      description: Returns recently planned routes for display in the chat history
      responses:
        "200":
          description: List of route history items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RouteHistoryItem"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    RouteInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          description: Natural language description of the desired route
      required:
        - prompt
    Coordinates:
      type: object
      properties:
        lat:
          type: number
          description: Latitude of the location
        lng:
          type: number
          description: Longitude of the location
      required:
        - lat
        - lng
    WayPointCandidate:
      type: object
      properties:
        name:
          type: string
          description: Name of the waypoint
        place_type:
          type: string
          description: Type of the waypoint (e.g. restaurant, gas station)
        coordinates:
          $ref: "#/components/schemas/Coordinates"
        near_route_id:
          type: ["string", "null"]
          description: Route ID near which this waypoint is located
        distance_from_route_metres:
          type: ["number", "null"]
          description: Distance in meters from the waypoint to the nearest route
        rating:
          type: ["number", "null"]
          description: Rating of the waypoint
        open_now:
          type: ["boolean", "null"]
          description: Whether the waypoint is currently open
      required:
        - name
        - place_type
        - coordinates
    CandidateRoute:
      type: object
      properties:
        route_id:
          type: string
          description: Unique identifier for the route
        duration_minutes:
          type: integer
          description: Estimated duration in minutes
        distance_metres:
          type: ["number", "null"]
          description: Estimated distance in meters
        polyline:
          type: ["string", "null"]
          description: Encoded polyline representing the route path
      required:
        - route_id
        - duration_minutes
    DetourRoute:
      type: object
      properties:
        route_id:
          type: string
          description: Unique identifier for the detour route
        duration_minutes:
          type: integer
          description: Estimated duration in minutes
        distance_metres:
          type: ["number", "null"]
          description: Estimated distance in meters
        polyline:
          type: ["string", "null"]
          description: Encoded polyline for non-transit detour routes
        legs:
          type: array
          items:
            $ref: "#/components/schemas/CandidateRoute"
          description: Legs for transit detour routes
      required:
        - route_id
        - duration_minutes
        - legs
    DetourScore:
      type: object
      properties:
        base_route:
          $ref: "#/components/schemas/CandidateRoute"
        waypoint:
          $ref: "#/components/schemas/WayPointCandidate"
        detour_route:
          $ref: "#/components/schemas/DetourRoute"
        detour_minutes:
          type: integer
          description: Additional time in minutes added due to the detour
        score:
          type: number
          description: Score for ranking or comparison
      required:
        - base_route
        - waypoint
        - detour_route
        - detour_minutes
        - score
    ConstraintValidatorAgentOutput:
      type: object
      properties:
        accepted_routes:
          type: array
          items:
            $ref: "#/components/schemas/DetourScore"
          description: Accepted routes that meet the specified constraints
        final_route:
          oneOf:
            - $ref: "#/components/schemas/DetourScore"
            - type: "null"
          description: Final selected route after constraint validation
        status:
          type: string
          enum:
            - valid_route_found
            - no_valid_route_found
          description: Status of the constraint validation process
      required:
        - accepted_routes
        - status
    RouteHistoryItem:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier
        prompt:
          type: string
          description: The user prompt
        status:
          type: string
          enum:
            - valid_route_found
            - no_valid_route_found
          description: Status of the route planning
        duration_minutes:
          type: ["integer", "null"]
          description: Duration of the final route in minutes
        waypoint_name:
          type: ["string", "null"]
          description: Name of the waypoint in the final route
        created_at:
          type: string
          format: date-time
          description: When the route was planned
      required:
        - id
        - prompt
        - status
        - created_at
